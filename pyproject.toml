[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recap-eod"
version = "0.1.0"
description = "On-demand engineering activity recap"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["tzlocal>=5,<6", "tzdata>=2024.1", "prompt_toolkit>=3.0.52,<4"]

[project.optional-dependencies]
dev = ["pre-commit>=4,<5", "pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
recap = "recap.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
recap = ["web/*.html", "web/*.css", "web/*.js", "web/*.svg"]
